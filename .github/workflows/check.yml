# Loads the site in a real Chromium at three widths (both colour schemes) with the same security headers Cloudflare Pages will send, and fails on a broken
# image or link, an outside request, a console error or sideways scrolling (scripts/check-site.mjs).
# The engine's check.yml runs on pushes to main only; this one also runs on pull requests because the page is cheap to test and what merges is what ships.
name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-site.mjs
